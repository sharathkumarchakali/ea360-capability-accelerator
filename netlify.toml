[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Prototype SPA lives under /app — hash routes and deep paths fall back to the app shell
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Private / controlled preview guidance: do not auto-publish publicly.
# Use Netlify Deploy Previews or password protection for customer demos.
